  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="dashboard.html"><img src="assets/logo.svg" alt="braculink" height="24" /></a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html" class="active">Courses</a>
      <a href="swap.html">Swap</a>
      <a href="groups.html">Groups</a>
      <a href="friends.html">Friends</a>
      <a href="profile.html">Profile</a>
      <div class="notif-wrap">
        <button type="button" class="notif-bell" id="notif-bell-button" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="notif-count" class="notif-badge hidden">0</span>
        </button>
        <div id="notif-panel" class="card notif-panel hidden">
          <p class="card-label">NOTIFICATIONS</p>
          <div id="notif-list" class="stack stack-sm">loading…</div>
        </div>
      </div>
      <button type="button" class="btn-secondary" onclick="logout()">logout</button>
    </div>
  </nav>

  <div class="container stack stack-lg" style="padding-top: 32px; padding-bottom: 48px;">
    <h1>my courses</h1>

    <section class="card stack stack-md">
      <div class="field">
        <label for="course-search">COURSE CODE</label>
        <input id="course-search" type="text" placeholder="e.g. CSE110 or Introduction to Computer Science" autocomplete="off" />
      </div>
      <div id="search-results" class="result-list hidden"></div>
    </section>

    <section id="sections-card" class="card stack stack-md hidden">
      <p class="card-label" id="sections-title">SECTIONS</p>
      <div id="sections-banner" class="banner hidden"></div>
      <div id="sections-wrap" class="mono muted text-sm">loading…</div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    requireAuth();
    initNotifications();

    let searchDebounceTimer = null;
    let currentSemesterSessionId = null;
    let selectedCourseCode = null;

    async function getSemesterSessionId() {
      if (currentSemesterSessionId === null) {
        currentSemesterSessionId = await apiFetch("/api/courses/current-semester");
      }
      return currentSemesterSessionId;
    }

    function renderSearchResults(courses) {
      const resultsWrap = document.getElementById("search-results");
      if (!courses || courses.length === 0) {
        resultsWrap.replaceChildren();
        resultsWrap.classList.add("hidden");
        return;
      }

      resultsWrap.replaceChildren(
        ...courses.map((course) => {
          const row = document.createElement("div");
          row.className = "result-row";
          row.innerHTML = `
            <span class="result-row-code">${course.courseCode}</span>
            <span class="result-row-name">${course.courseName}</span>
          `;
          row.addEventListener("click", () => selectCourse(course.courseCode));
          return row;
        })
      );
      resultsWrap.classList.remove("hidden");
    }

    async function runSearch(search) {
      const resultsWrap = document.getElementById("search-results");
      if (!search) {
        resultsWrap.replaceChildren();
        resultsWrap.classList.add("hidden");
        return;
      }

      try {
        const courses = await apiFetch(`/api/courses?search=${encodeURIComponent(search)}`);
        renderSearchResults(courses);
      } catch (error) {
        resultsWrap.replaceChildren();
        resultsWrap.classList.add("hidden");
      }
    }

    function onSearchInput(event) {
      const search = event.target.value.trim();
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => runSearch(search), 250);
    }

    function renderCell(text) {
      return text ? text : `<span class="muted">—</span>`;
    }

    function renderSeatsCell(seats) {
      if (seats > 0) {
        return `<span class="mono" style="color: var(--success);">${seats}</span>`;
      }
      return `<span class="badge badge-danger">FULL</span>`;
    }

    async function enroll(sectionName, button) {
      const banner = document.getElementById("sections-banner");
      button.disabled = true;
      try {
        const semesterSessionId = await getSemesterSessionId();
        await apiFetch("/api/enrollments", {
          method: "POST",
          body: JSON.stringify({
            courseCode: selectedCourseCode,
            sectionName,
            semesterSessionId,
          }),
        });
        banner.className = "banner banner-success";
        banner.textContent = `Enrolled in ${selectedCourseCode} · ${sectionName}`;
        await loadSections(selectedCourseCode);
      } catch (error) {
        banner.className = "banner banner-error";
        banner.textContent = error.message;
        button.disabled = false;
      }
    }

    function renderSections(sections) {
      const wrap = document.getElementById("sections-wrap");
      if (!sections || sections.length === 0) {
        wrap.textContent = "no sections found for this semester";
        return;
      }

      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th>section</th>
            <th>theory faculty</th>
            <th>theory timing</th>
            <th>lab faculty</th>
            <th>lab timing</th>
            <th>seats</th>
            <th>room</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${sections
            .map((section) => {
              const seats = section.availableSeats == null ? 0 : section.availableSeats;
              return `
                <tr data-section="${section.sectionName}">
                  <td class="mono">${section.sectionName}</td>
                  <td>${renderCell(section.theoryFaculty)}</td>
                  <td class="mono text-sm">${renderCell(section.theoryTiming)}</td>
                  <td>${section.hasLab ? renderCell(section.labFaculty) : "—"}</td>
                  <td class="mono text-sm">${section.hasLab ? renderCell(section.labTiming) : "—"}</td>
                  <td>${renderSeatsCell(seats)}</td>
                  <td>${renderCell(section.roomName)}</td>
                  <td><button type="button" class="btn btn-sm">Enroll</button></td>
                </tr>
              `;
            })
            .join("")}
        </tbody>
      `;

      table.querySelectorAll("tbody tr").forEach((row) => {
        const button = row.querySelector("button");
        button.addEventListener("click", () => enroll(row.dataset.section, button));
      });

      wrap.replaceChildren(table);
    }

    async function loadSections(courseCode) {
      const wrap = document.getElementById("sections-wrap");
      wrap.textContent = "loading…";
      try {
        const semesterSessionId = await getSemesterSessionId();
        const sections = await apiFetch(`/api/courses/${encodeURIComponent(courseCode)}/sections?semesterSessionId=${semesterSessionId}`);
        renderSections(sections);
      } catch (error) {
        wrap.className = "";
        const banner = document.createElement("div");
        banner.className = "banner banner-error";
        banner.textContent = error.message;
        wrap.replaceChildren(banner);
      }
    }

    function selectCourse(courseCode) {
      selectedCourseCode = courseCode;

      document.getElementById("course-search").value = courseCode;
      document.getElementById("search-results").classList.add("hidden");

      document.getElementById("sections-title").textContent = `SECTIONS · ${courseCode}`;
      const banner = document.getElementById("sections-banner");
      banner.className = "banner hidden";
      document.getElementById("sections-card").classList.remove("hidden");

      loadSections(courseCode);
    }

    document.getElementById("course-search").addEventListener("input", onSearchInput);
  </script>
</body>
</html>
