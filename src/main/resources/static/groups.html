<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>braculink // groups</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="dashboard.html"><img src="assets/logo.svg" alt="braculink" height="24" /></a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">Courses</a>
      <a href="swap.html">Swap</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="friends.html">Friends</a>
      <a href="profile.html">Profile</a>
      <div class="notif-wrap">
        <button type="button" class="notif-bell" id="notif-bell-button" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span id="notif-count" class="notif-badge hidden">0</span>
        </button>
        <div id="notif-panel" class="card notif-panel hidden">
          <p class="card-label">NOTIFICATIONS</p>
          <div id="notif-list" class="stack stack-sm">loading…</div>
        </div>
      </div>
      <button type="button" class="btn-secondary" onclick="logout()">logout</button>
    </div>
  </nav>

  <div class="container stack stack-lg" style="padding-top: 32px; padding-bottom: 48px;">
    <h1>my swap groups</h1>

    <div id="groups-banner" class="banner hidden"></div>

    <div id="groups-wrap" class="stack stack-lg">
      <p class="mono muted text-sm">loading…</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    requireAuth();
    initNotifications();

    let myUserId = null;

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function statusBadgeClass(status) {
      if (status === "PROPOSED") return "badge-warning";
      if (status === "CONFIRMED" || status === "COMPLETED") return "badge-success";
      if (status === "DECLINED" || status === "CANCELLED" || status === "EXPIRED") return "badge-danger";
      return "badge";
    }

    function renderMemberRow(member) {
      const profile = member.profile || {};
      const fb = profile.fbProfileUrl
        ? `<a class="btn-secondary btn-sm mono" href="${escapeHtml(profile.fbProfileUrl)}" target="_blank" rel="noopener noreferrer">OPEN FB</a>`
        : `<span class="muted">&mdash;</span>`;
      const phone = profile.phoneNumber
        ? `<span class="mono">${escapeHtml(profile.phoneNumber)}</span>`
        : `<span class="muted">&mdash;</span>`;
      const confirmed = member.confirmed
        ? `<span style="color: var(--success);">&#10003;</span>`
        : `<span class="muted">&mdash;</span>`;

      return `
        <tr>
          <td style="font-weight: 500;">${escapeHtml(profile.fullName)}</td>
          <td class="mono muted">${escapeHtml(profile.studentId)}</td>
          <td class="mono">
            ${escapeHtml(member.fromSection)}
            <span style="color: var(--accent);">&rarr;</span>
            ${escapeHtml(member.toSection)}
          </td>
          <td>${fb}</td>
          <td>${phone}</td>
          <td>${confirmed}</td>
        </tr>
      `;
    }

    function renderGroupFooter(group) {
      if (group.status === "CONFIRMED") {
        return `<p class="mono muted text-sm" style="margin: 0;">swap confirmed &mdash; coordinate with your group and register the change</p>`;
      }

      if (group.status === "PROPOSED") {
        const me = (group.members || []).find((member) => member.userId === myUserId);
        if (me && !me.confirmed) {
          return `
            <div class="row row-md">
              <button type="button" class="btn btn-confirm">Confirm</button>
              <button type="button" class="btn-secondary btn-decline">Decline</button>
            </div>
          `;
        }
        if (me && me.confirmed) {
          return `<p class="mono muted text-sm" style="margin: 0;">waiting for other members to confirm</p>`;
        }
      }

      return "";
    }

    function renderGroup(group) {
      const card = document.createElement("div");
      card.className = "card stack stack-md" + (group.status === "CONFIRMED" ? " card-confirmed" : "");

      card.innerHTML = `
        <div class="row" style="justify-content: space-between; align-items: center;">
          <span class="mono" style="font-weight: 600;">GROUP &middot; ${escapeHtml(group.courseCode)}</span>
          <span class="badge ${statusBadgeClass(group.status)}">${escapeHtml(group.status)}</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>name</th>
              <th>id</th>
              <th>from &rarr; to</th>
              <th>fb</th>
              <th>phone</th>
              <th>confirmed</th>
            </tr>
          </thead>
          <tbody>
            ${(group.members || []).map(renderMemberRow).join("")}
          </tbody>
        </table>
        <div class="group-footer">${renderGroupFooter(group)}</div>
      `;

      const confirmButton = card.querySelector(".btn-confirm");
      if (confirmButton) {
        confirmButton.addEventListener("click", () => respond(group.groupId, "confirm", confirmButton));
      }
      const declineButton = card.querySelector(".btn-decline");
      if (declineButton) {
        declineButton.addEventListener("click", () => respond(group.groupId, "decline", declineButton));
      }

      return card;
    }

    function renderGroups(groups) {
      const wrap = document.getElementById("groups-wrap");
      if (!groups || groups.length === 0) {
        wrap.replaceChildren();
        const empty = document.createElement("p");
        empty.className = "mono muted text-sm";
        empty.textContent = "no swap groups yet";
        wrap.appendChild(empty);
        return;
      }
      wrap.replaceChildren(...groups.map(renderGroup));
    }

    async function respond(groupId, action, button) {
      const banner = document.getElementById("groups-banner");
      banner.className = "banner hidden";

      const row = button.parentElement;
      const buttons = row.querySelectorAll("button");
      buttons.forEach((btn) => (btn.disabled = true));

      try {
        await apiFetch(`/api/swap-groups/${groupId}/${action}`, { method: "POST" });
        await loadGroups();
      } catch (error) {
        banner.className = "banner banner-error";
        banner.textContent = error.message;
        buttons.forEach((btn) => (btn.disabled = false));
      }
    }

    async function loadGroups() {
      const wrap = document.getElementById("groups-wrap");
      try {
        const [me, groups] = await Promise.all([
          myUserId === null ? apiFetch("/api/users/me") : Promise.resolve({ id: myUserId }),
          apiFetch("/api/swap-groups/me"),
        ]);
        myUserId = me.id;
        renderGroups(groups);
      } catch (error) {
        const banner = document.createElement("div");
        banner.className = "banner banner-error";
        banner.textContent = error.message;
        wrap.replaceChildren(banner);
      }
    }

    loadGroups();
  </script>
</body>
</html>
